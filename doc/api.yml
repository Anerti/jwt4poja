openapi: 3.0.3
info:
  title: jwt4poja API
  version: 1.0.0
  description: |
    JWT authentication template API — POJA-generated Spring Boot app
    (package `com.techindna.anerti`, schema `jwt4poja_app`).

    Auth endpoints (`/auth/**`) are public. Users endpoints (`/users/**`)
    require a JWT; `GET /users` and `GET /users/{userId}` are implemented,
    the rest are planned.

    Roles: `CUSTOMER` (default) and `ADMIN`.
servers:
  - url: http://localhost:8080
tags:
  - name: auth
    description: Registration, login and email verification (public)
  - name: users
    description: User management (JWT required)
paths:
  /auth/register:
    post:
      tags: [auth]
      summary: Register a new user
      description: Creates a CUSTOMER account and sends a verification email.
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
      responses:
        '202':
          description: Accepted — verification email sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageBody'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
  /auth/login:
    post:
      tags: [auth]
      summary: Login and request a verification link
      description: Checks credentials and sends a login-verification email.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '202':
          description: Accepted — login-verification email sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageBody'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/resend-link:
    post:
      tags: [auth]
      summary: Resend the email-verification link
      description: Re-sends the verification email to an unverified account.
      operationId: resendVerificationLink
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
            format: email
      responses:
        '202':
          description: Accepted — verification email re-sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageBody'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/verification/{token}:
    get:
      tags: [auth]
      summary: Verify the email token and obtain a JWT
      description: |
        Single-use token (15-minute TTL). Marks the user verified and returns a
        JWT plus the user payload. Serves both registration and login
        verification.
      operationId: verify
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Verified — JWT issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyRegistrationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users:
    get:
      tags: [users]
      summary: List users (ADMIN only)
      description: |
        Lists CUSTOMER users. `search` matches username, first name, last name
        or email (case-insensitive substring). One-based `page` (default 1;
        values below 1 fall back to the default). `size` (default 10, max 100;
        values below 1 fall back to the default, values above 100 are capped).
        `sort` direction applied to `createdAt` (default `ASC`).
      operationId: listUsers
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [ASC, DESC]
            default: ASC
      responses:
        '200':
          description: Page of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /users/{userId}:
    get:
      tags: [users]
      summary: Get a user by id
      description: Owner or ADMIN (ADMIN cannot access another ADMIN).
      operationId: getUser
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The requested user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [users]
      summary: Partially update a user profile
      description: Not implemented yet. Owner or ADMIN; only present fields are applied.
      operationId: updateUser
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserInput'
      responses:
        '200':
          description: The updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [users]
      summary: Delete a user account
      description: Not implemented yet. Owner or ADMIN (same rule as GET and PATCH).
      operationId: deleteUser
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted — no content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT from `GET /auth/verification/{token}` (subject = user id, claim `role`)
  responses:
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    Unauthorized:
      description: Missing/invalid JWT or bad credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    Forbidden:
      description: Authenticated but not allowed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    Conflict:
      description: Uniqueness conflict (email or username already in use)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    UnprocessableContent:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
  schemas:
    UserRole:
      type: string
      enum: [CUSTOMER, ADMIN]
    User:
      type: object
      required: [id, username, firstName, lastName, email, role, createdAt]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true
    RegisterInput:
      type: object
      required: [username, password, confirmPassword, firstName, lastName, email]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
          minLength: 12
          description: 12+ chars with upper, lower, digit and special char
        confirmPassword:
          type: string
          format: password
          description: Must match `password`
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
    LoginInput:
      type: object
      required: [password]
      description: Either `username` or `email` plus `password`
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    MessageBody:
      type: object
      required: [message]
      properties:
        message:
          type: string
    VerifyRegistrationResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          description: JWT (subject = user id, claim `role`)
        user:
          $ref: '#/components/schemas/User'
    UpdateUserInput:
      type: object
      description: Partial update — only present fields are applied
      properties:
        username:
          type: string
        firstName:
          type: string
        lastName:
          type: string
    Meta:
      type: object
      required: [page, size, total]
      properties:
        page:
          type: integer
        size:
          type: integer
        total:
          type: integer
          format: int64
    UserListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
        meta:
          $ref: '#/components/schemas/Meta'
    ErrorBody:
      type: object
      required: [status, error, message, timestamp]
      properties:
        status:
          type: integer
          description: HTTP status code
        error:
          type: string
          description: Uppercased reason phrase, e.g. CONFLICT
        message:
          type: string
        timestamp:
          type: string
          format: date-time
