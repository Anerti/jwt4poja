openapi: 3.0.3
info:
  title: jwt4poja API
  version: 1.0.0
  description: |
    JWT authentication template API — POJA-generated Spring Boot app
    (package `com.techindna.anerti`, schema `jwt4poja_app`).

    Auth endpoints (`/auth/**`) are public and implemented: register/login with
    email verification, JWT bearer tokens (jjwt 0.12, HMAC-signed).

    Users endpoints (`/users/**`) describe the intended API contract but are
    NOT yet implemented in code — see README.

    Roles: `CUSTOMER` (default) and `ADMIN` (DB enum `jwt4poja_app.user_role`).
servers:
  - url: http://localhost:8080
tags:
  - name: auth
    description: Registration, login and email verification (public — no token required)
  - name: users
    description: User management (JWT required; ADMIN for listing, owner or ADMIN for single-user ops)
paths:
  /auth/register:
    post:
      tags: [auth]
      summary: Register a new user
      description: |
        Creates a CUSTOMER account (role is fixed server-side, never taken from
        the payload), stores a 15-minute verification token in Redis and sends a
        verification email (EventBridge -> SQS -> SES, template
        `templates/mail/verification.html`).
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
      responses:
        '202':
          description: Accepted — verification email sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageBody'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
  /auth/login:
    post:
      tags: [auth]
      summary: Login and request a verification link
      description: |
        Checks credentials (username or email + password, Argon2). Does NOT issue
        a token directly: sends a login-verification link by email (template
        `templates/mail/login-verification.html`); the token in that link is
        exchanged via `/auth/verification/{token}`.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '202':
          description: Accepted — login-verification email sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageBody'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/resend-link:
    post:
      tags: [auth]
      summary: Resend the email-verification link
      operationId: resendVerificationLink
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
            format: email
      responses:
        '202':
          description: Accepted — verification email re-sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageBody'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/verification/{token}:
    get:
      tags: [auth]
      summary: Verify the email token and obtain a JWT
      description: |
        Single-use token (15-minute TTL in Redis). On success marks the user
        verified and returns a JWT (subject = user id, claim `role` =
        CUSTOMER|ADMIN) plus the user payload. The same endpoint serves both
        registration and login verification.
      operationId: verify
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Verified — JWT issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyRegistrationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users:
    get:
      tags: [users]
      summary: List users (ADMIN only)
      description: |
        Planned — controller NOT yet implemented. Intended contract: ADMIN can
        list CUSTOMER users (`ResourcesAccessRules.grantListUsersAccess`), with
        optional filters and Spring Data pagination.
      operationId: listUsers
      security:
        - bearerAuth: []
      parameters:
        - name: username
          in: query
          required: false
          schema:
            type: string
        - name: firstName
          in: query
          required: false
          schema:
            type: string
        - name: lastName
          in: query
          required: false
          schema:
            type: string
        - name: email
          in: query
          required: false
          schema:
            type: string
            format: email
        - name: page
          in: query
          required: false
          description: Zero-based page index (default 0)
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          description: Page size (default 20)
          schema:
            type: integer
            default: 20
        - name: sort
          in: query
          required: false
          description: Sort expression, e.g. `createdAt,desc`
          schema:
            type: string
      responses:
        '200':
          description: Page of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /users/{userId}:
    get:
      tags: [users]
      summary: Get a user by id
      description: |
        Planned — controller NOT yet implemented. Intended contract: owner of
        the profile or ADMIN (`ResourcesAccessRules.grantAccessFor`; ADMIN
        cannot access another ADMIN's profile).
      operationId: getUser
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The requested user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [users]
      summary: Partially update a user profile
      description: |
        Planned — controller NOT yet implemented. Intended contract: owner or
        ADMIN; updates only the fields present in the payload
        (`UserMapper.applyUpdate`).
      operationId: updateUser
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserInput'
      responses:
        '200':
          description: The updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [users]
      summary: Delete a user account
      description: |
        Planned — controller NOT yet implemented. Intended contract: owner or
        ADMIN (same access rule as GET and PATCH).
      operationId: deleteUser
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted — no content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT returned by `GET /auth/verification/{token}` (subject = user id, claim `role` = CUSTOMER|ADMIN)
  responses:
    BadRequest:
      description: Malformed request (e.g. invalid parameter format)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    Unauthorized:
      description: Missing/invalid JWT, bad credentials, or invalid verification token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    Forbidden:
      description: Authenticated but not allowed (wrong role, not owner, account not verified)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    Conflict:
      description: Uniqueness conflict (email or username already in use)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    UnprocessableContent:
      description: Validation failed (field rules, password policy, mismatched passwords)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
  schemas:
    UserRole:
      type: string
      enum: [CUSTOMER, ADMIN]
    User:
      type: object
      required: [id, username, firstName, lastName, email, role, createdAt]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true
    RegisterInput:
      type: object
      required: [username, password, confirmPassword, firstName, lastName, email]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
          minLength: 12
          description: At least 12 chars with one uppercase, one lowercase, one digit and one special char
        confirmPassword:
          type: string
          format: password
          description: Must match `password`
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
    LoginInput:
      type: object
      required: [password]
      description: Either `username` or `email` (or both) plus `password`
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    MessageBody:
      type: object
      required: [message]
      properties:
        message:
          type: string
    VerifyRegistrationResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          description: JWT (HMAC-signed; subject = user id, claim `role`)
        user:
          $ref: '#/components/schemas/User'
    UpdateUserInput:
      type: object
      description: Partial update — only present fields are applied
      properties:
        username:
          type: string
        firstName:
          type: string
        lastName:
          type: string
    Meta:
      type: object
      required: [page, size, total]
      properties:
        page:
          type: integer
        size:
          type: integer
        total:
          type: integer
          format: int64
    UserListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
        meta:
          $ref: '#/components/schemas/Meta'
    ErrorBody:
      type: object
      required: [status, error, message, timestamp]
      properties:
        status:
          type: integer
          description: HTTP status code
        error:
          type: string
          description: Uppercased reason phrase, e.g. CONFLICT
        message:
          type: string
        timestamp:
          type: string
          format: date-time
