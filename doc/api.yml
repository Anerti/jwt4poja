        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /grades/compute/{studentInheritanceId}/course/{courseRef}:
    get:
      tags: [grades]
      summary: Compute the weighted grade of a student for one course
      description: |
        Computes the weighted average grade of the student identified by
        `studentInheritanceId` for the course identified by `courseRef`. For
        each exam of that course the most recent grade (latest `createdAt`)
        is taken, then the result is:

            weightedAverage = Σ (grade.value × exam.coefficient)

        Because all coefficients of a course sum to 1 this is a standard
        weighted average. Only exams that have a grade are included; if no
        grade exists for any exam the weighted average is `0`.

        Role-based visibility:
        - ADMIN and the owning STUDENT can always compute.
        - TEACHER can only compute for courses assigned to them.

        Returns 404 when the student, course or exam does not exist.
      operationId: computeCourseGrade
      security:
        - bearerAuth: []
      parameters:
        - name: studentInheritanceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: courseRef
          in: path
          required: true
          schema:
            type: string
            maxLength: 10
      responses:
        '200':
          description: Weighted grade for the course
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseGradeOutput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /grade-reports:
    post:
      tags: [reports]
      summary: Generate and email the annual grade report (ADMIN)
      description: |
        Generates the annual grade report as a PDF for the
        student identified by `studentInheritanceId` for the given `academicYear`.

        The PDF contains:
        - Student identity (first name, last name, ref)
        - Academic year
        - Per-course breakdown: exam name, grade value, coefficient, and
          per-course weighted average
        - General weighted average across all courses
        - Class ranking (rank among all students in the same class)

        The generated PDF is stored on S3 and sent to the email address of
        the user who triggered the request, asynchronously via the event
        pipeline (EventBridge → SQS → Lambda).

        Business rules:
        1. The student must exist (404 otherwise).
        2. The student must have at least one grade for the given academic
           year; otherwise the request is refused (409).
        3. The student must be enrolled in a class (have a `classId`); a
           report without a class has no ranking context and is refused (409).

        ADMIN can generate a report for any student.
      operationId: generateGradeReport
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GradeReportInput'
      responses:
        '202':
          description: Accepted — PDF generation and email sending queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GradeReportResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Student has no grades for the given academic year or is not enrolled in a class
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /reports/students/{studentInheritanceId}/average:
    get:
      tags: [reports]
      summary: Compute the general average of a student
      description: |
        Computes the general weighted average of the student identified by
        `studentInheritanceId` across all courses. For each course, the most
        recent grade per exam (latest `createdAt`) is taken, the per-course
        weighted average is computed as `Σ (grade.value × exam.coefficient)`
        (coefficients of a course sum to 1), then the general average is:

            generalAverage = Σ (courseWeightedAverage × course.credits)
                             ─────────────────────────────────────────
                                        Σ course.credits

        An optional `academicYear` query parameter restricts the calculation
        to exams of that year. If omitted, all academic years are included.

        Role-based visibility:
        - ADMIN can always compute.
        - TEACHER can only compute for students whose graded exams belong to
          courses assigned to them.
        - STUDENT can only compute their own average.

        Returns 404 when the student does not exist.
      operationId: getStudentAverage
      security:
        - bearerAuth: []
      parameters:
        - name: studentInheritanceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: academicYear
          in: query
          required: false
          description: Exact match on the exam's academic year (e.g. `2024-2025`). Omit to include all years.
          schema:
            type: string
            maxLength: 10
      responses:
        '200':
          description: General weighted average
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentGeneralAverage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT from `GET /auth/verification/{token}` (subject = user id, claim `role`)
  responses:
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            status: 400
            error: Bad Request
            message: "Malformed request: invalid UUID in path"
            timestamp: 2026-08-13T12:00:00Z
    Unauthorized:
      description: Missing/invalid JWT or bad credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            status: 401
            error: Unauthorized
            message: Missing or invalid token
            timestamp: 2026-08-13T12:00:00Z
    Forbidden:
      description: Authenticated but not allowed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            status: 403
            error: Forbidden
            message: Access denied for this role
            timestamp: 2026-08-13T12:00:00Z
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            status: 404
            error: Not Found
            message: Resource not found
            timestamp: 2026-08-13T12:00:00Z
    Conflict:
      description: Uniqueness conflict (username, email or ref already in use)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            status: 409
            error: Conflict
            message: A resource with this unique value already exists
            timestamp: 2026-08-13T12:00:00Z
    UnprocessableContent:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            status: 422
            error: Unprocessable Content
            message: "Validation failed: coefficient must be greater than 0"
            timestamp: 2026-08-13T12:00:00Z
    InternalServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            status: 500
            error: Internal Server Error
            message: An unexpected error occurred
            timestamp: 2026-08-13T12:00:00Z
  schemas:
    UserRole:
      type: string
      enum: [ADMIN, TEACHER, STUDENT]
    Level:
      type: string
      enum: [L1, L2, L3]
      description: Academic level a student belongs to.
    LearningPath:
      type: string
      enum: [EL, TN, COMMON]
      description: Student learning path. COMMON applies to both paths.
    CourseType:
      type: string
      enum: [EL, TN, COMMON]
      description: Learning path a course or group belongs to. COMMON = shared by all paths.
    TeacherStatus:
      type: string
      enum: [ACTIVE, INACTIVE, OTHER]
    StudentStatus:
      type: string
      enum: [GRADUATED, ACTIVE, INACTIVE]
    User:
      type: object
      required: [id, username, firstName, lastName, email, role, createdAt]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
          maxLength: 50
        firstName:
          type: string
          maxLength: 100
        lastName:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 100
        role:
          $ref: '#/components/schemas/UserRole'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true
      example:
        id: 3f3e9b2a-1c4e-4a9d-8f2b-5e7a1c0d9f21
        username: mdupont
        firstName: Marie
        lastName: Dupont
        email: marie.dupont@hacheuil.edu
        role: STUDENT
        createdAt: 2023-09-04T09:00:00Z
        updatedAt: null
    LoginInput:
      type: object
      required: [password]
      description: Either `username` or `email` plus `password`
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
      example:
        username: mdupont
        password: s3cur3P@ss
    MessageBody:
      type: object
      required: [message]
      properties:
        message:
          type: string
      example:
        message: A verification link has been sent to your email
    VerifyRegistrationResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          description: JWT (subject = user id, claim `role`)
        user:
