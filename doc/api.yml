openapi: 3.0.3
info:
  title: jwt4poja API
  version: 1.0.0
  description: |
    Grade management API for a 3-year L2 program (POJA-generated Spring Boot
    app, package `com.techindna.anerti`, schema `jwt4poja_app`).

    Roles: `ADMIN`, `TEACHER`, `STUDENT`. There is no public registration:
    accounts are created by an `ADMIN` (`POST /students`, `POST /teachers`).
    Auth endpoints (`/auth/**`) and the course catalog listing (`GET /courses`)
    are public; everything else requires a JWT.
servers:
  - url: http://localhost:8080
tags:
  - name: auth
    description: Login and email verification (public)
  - name: courses
    description: Courses and course catalog (ADMIN manages, public catalog listing)
  - name: exams
    description: Exams per course and academic year (ADMIN manages, TEACHER and STUDENT read)
  - name: teachers
    description: Teacher accounts and teacher inheritance records (ADMIN)
  - name: students
    description: Student accounts and student inheritance records (ADMIN; owner read)
  - name: groups
    description: Student groups (ADMIN manages, TEACHER reads)
  - name: classes
    description: Classes and class enrollment (ADMIN manages, TEACHER reads)
  - name: assignments
    description: Course-to-teacher assignments per year (ADMIN)
  - name: grades
    description: Grades (ADMIN, TEACHER for own courses, STUDENT for own grades)
  - name: reports
    description: Class rankings, general averages and downloadable reports (ADMIN, TEACHER)
paths:
  /auth/login:
    post:
      tags: [auth]
      summary: Login and request a verification link
      description: Checks credentials and sends a login-verification email.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '202':
          description: Accepted — login-verification email sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageBody'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/verification/{token}:
    get:
      tags: [auth]
      summary: Verify the email token and obtain a JWT
      description: |
        Single-use token (15-minute TTL). Consumes the token and returns a JWT
        plus the user payload. Serves login verification.
      operationId: verify
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Verified — JWT issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyRegistrationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /courses:
    post:
      tags: [courses]
      summary: Create a course (ADMIN)
      description: Creates a course. `ref` must be unique across courses.
      operationId: createCourse
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCourseInput'
      responses:
        '201':
          description: Course created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseOutput'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags: [courses]
      summary: List courses (public)
      description: |
        Public endpoint — no authentication required. Lists courses ordered by
        `createdAt`. `search` matches `ref` or `title` (case-insensitive
        substring, partial match). `type` filters by exact learning path.
      operationId: listCourses
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/CourseType'
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Page of courses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseListResponse'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /courses/{courseId}:
    get:
      tags: [courses]
      summary: Get a course by id (ADMIN, TEACHER)
      operationId: getCourse
      security:
        - bearerAuth: []
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The requested course
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseOutput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [courses]
      summary: Partially update a course (ADMIN)
      description: |
        Partially updates the course. `ref`, `title`, `type` and `credits` can
        all be modified; only present fields are applied. A `ref` change must
        stay unique.
      operationId: updateCourse
      security:
        - bearerAuth: []
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCourseInput'
      responses:
        '200':
          description: The updated course
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseOutput'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /exams:
    post:
      tags: [exams]
      summary: Create an exam (ADMIN, TEACHER)
      description: |
        Creates an exam for a course and an academic year. The `coefficient` is
        a fixed-point decimal (`numeric(10,2)`, e.g. `0.5`, `0.2`, `0.33`); the
        coefficients of all exams of a course must sum to 1. ADMIN can create an
        exam for any course; a
        TEACHER can only create exams for courses assigned to them.
      operationId: createExam
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExamInput'
      responses:
        '201':
          description: Exam created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exam'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags: [exams]
      summary: List exams (ADMIN, TEACHER, STUDENT)
      description: |
        Lists exams ordered by `date`. `ref` (course ref, partial match),
        `academicYear` (exact match), `startDate` and `endDate` (exam `date`
        range) filters. ADMIN and STUDENT see all exams; a TEACHER only sees
        exams of courses assigned to them.
      operationId: listExams
      security:
        - bearerAuth: []
      parameters:
        - name: ref
          in: query
          required: false
          schema:
            type: string
            maxLength: 10
          description: Course ref of the exam (partial match)
        - name: academicYear
          in: query
          required: false
          description: Exact match on the academic year (e.g. `2024-2025`)
          schema:
            type: string
            maxLength: 10
        - name: startDate
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Inclusive lower bound on exam `date`
        - name: endDate
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Inclusive upper bound on exam `date`
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Page of exams
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /exams/{examId}:
    get:
      tags: [exams]
      summary: Get an exam by id (ADMIN, TEACHER)
      operationId: getExam
      security:
        - bearerAuth: []
      parameters:
        - name: examId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The requested exam
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exam'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [exams]
      summary: Partially update an exam (ADMIN, TEACHER)
      description: |
        Only present fields are applied. ADMIN can update any exam; a TEACHER
        can only update exams of courses assigned to them and cannot change the
        `courseId` (an exam stays attached to the course it was created for).
      operationId: updateExam
      security:
        - bearerAuth: []
      parameters:
        - name: examId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateExamInput'
      responses:
        '200':
          description: The updated exam
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exam'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [exams]
      summary: Delete an exam (ADMIN, TEACHER)
      description: |
        ADMIN can delete any exam; a TEACHER can only delete exams of courses
        assigned to them. Refused (409) when grades still reference it.
      operationId: deleteExam
      security:
        - bearerAuth: []
      parameters:
        - name: examId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted — no content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /teachers:
    post:
      tags: [teachers]
      summary: Create a teacher (ADMIN)
      description: |
        Creates the underlying user account (role `TEACHER`) and its teacher
        inheritance record in one operation. `username`, `email` and `ref` must
        be unique.
      operationId: createTeacher
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTeacherInput'
      responses:
        '201':
          description: Teacher created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserExtendTeacher'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags: [teachers]
      summary: List teachers (ADMIN)
      description: |
        Lists teachers. `search` matches `ref`, first name or last name
        (case-insensitive substring, partial match). `teacherStatus` filters by
        exact status. `page` is 1-indexed; a `page` or `size` below 1 or above
        100 is not an error — it falls back to the default (1 and 10).
      operationId: listTeachers
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: teacherStatus
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TeacherStatus'
        - name: page
          in: query
          required: false
          description: 1-indexed page. Values below 1 or above 100 fall back to 1.
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          required: false
          description: Page size. Values below 1 or above 100 fall back to 10.
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Page of teachers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /teachers/{teacherId}:
    get:
      tags: [teachers]
      summary: Get a teacher by id (ADMIN)
      operationId: getTeacher
      security:
        - bearerAuth: []
      parameters:
        - name: teacherId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The requested teacher
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserExtendTeacher'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [teachers]
      summary: Partially update a teacher (ADMIN)
      description: Only present fields are applied. A `ref` change must stay unique.
      operationId: updateTeacher
      security:
        - bearerAuth: []
      parameters:
        - name: teacherId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTeacherInput'
      responses:
        '200':
          description: The updated teacher
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserExtendTeacher'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /students:
    post:
      tags: [students]
      summary: Create a student (ADMIN)
      description: |
        Creates the underlying user account (role `STUDENT`) and its student
        inheritance record in one operation. Students are not created through
        self-registration — an `ADMIN` provisions them. `username`, `email` and
        `ref` must be unique; `groupId` and `classId` must reference an existing
        group and class.
      operationId: createStudent
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStudentInput'
      responses:
        '201':
          description: Student created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserExtendStudent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags: [students]
      summary: List students (ADMIN, TEACHER)
      description: |
        Lists students. `search` matches `ref`, first name or last name
        (case-insensitive substring, partial match). `level`, `learningPath`,
        `studentStatus`, `groupRef` and `className` are exact-match filters.
      operationId: listStudents
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: level
          in: query
          required: false
          description: Exact match on the student's academic level.
          schema:
            $ref: '#/components/schemas/Level'
        - name: learningPath
          in: query
          required: false
          description: Exact match on the student's learning path.
          schema:
            $ref: '#/components/schemas/LearningPath'
        - name: studentStatus
          in: query
          required: false
          description: Exact match on the student's status.
          schema:
            $ref: '#/components/schemas/StudentStatus'
        - name: groupRef
          in: query
          required: false
          description: Exact match on the reference of the group the student belongs to (`group.ref`).
          schema:
            type: string
            maxLength: 10
        - name: className
          in: query
          required: false
          description: Exact match on the name of the class the student is enrolled in (`class.name`).
          schema:
            type: string
            maxLength: 30
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Page of students
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /students/{studentId}:
    get:
      tags: [students]
      summary: Get a student by id
      description: ADMIN, a TEACHER, or the STUDENT who owns the record.
      operationId: getStudent
      security:
        - bearerAuth: []
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The requested student
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserExtendStudent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [students]
      summary: Partially update a student (ADMIN)
      description: |
        Only present fields are applied. Marking a student `GRADUATED` with a
        `graduationYear` sets their graduation year. A `ref` or `className`
        change must stay unique.
      operationId: updateStudent
      security:
        - bearerAuth: []
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStudentInput'
      responses:
        '200':
          description: The updated student
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserExtendStudent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /students/{studentId}/enroll:
    post:
      tags: [students]
      summary: Enroll a student in a class (ADMIN)
      description: |
        Enrolls the student identified by `studentId` in the class identified
        by `classId` (sets `student_inheritance.class_id`). The student must
        have a grade ≥ 10 for every course they have been graded on; if any
        course weighted average is below 10 the enrollment is refused (409).

        Business rule:
        1. Look up the student and verify it exists (404 otherwise).
        2. Verify the class exists (404 otherwise).
        3. For every course that has at least one grade, compute the
           weighted average (`Σ grade.value × exam.coefficient`). If any
           is < 10, return 409 with the list of failing courses.
        4. Set `student_inheritance.class_id` to the given class.
        5. Return the updated student payload.
      operationId: enrollStudentInClass
      security:
        - bearerAuth: []
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollClassInput'
      responses:
        '200':
          description: Student enrolled in the class
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserExtendStudent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Student has at least one course with a weighted average below 10
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentRejected'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /groups:
    post:
      tags: [groups]
      summary: Create a group (ADMIN)
      description: Creates a student group (e.g. `CQ1`, `TSMA1`). `ref` must be unique.
      operationId: createGroup
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroupInput'
      responses:
        '201':
          description: Group created
          content:
