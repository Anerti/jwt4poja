openapi: 3.0.3
info:
  title: jwt4poja API
  version: 1.0.0
  description: |
    Grade management API for a 3-year L2 program (POJA-generated Spring Boot
    app, package `com.techindna.anerti`, schema `jwt4poja_app`).

    Roles: `ADMIN`, `TEACHER`, `STUDENT`. There is no public registration:
    accounts are created by an `ADMIN` (`POST /students`, `POST /teachers`).
    Auth endpoints (`/auth/**`) and the course catalog listing (`GET /courses`)
    are public; everything else requires a JWT.
servers:
  - url: http://localhost:8080
tags:
  - name: auth
    description: Login and email verification (public)
  - name: courses
    description: Courses and course catalog (ADMIN manages, public catalog listing)
  - name: exams
    description: Exams per course and academic year (ADMIN manages, TEACHER reads)
  - name: teachers
    description: Teacher accounts and teacher inheritance records (ADMIN)
  - name: students
    description: Student accounts and student inheritance records (ADMIN; owner read)
  - name: groups
    description: Student groups (ADMIN manages, TEACHER reads)
  - name: assignments
    description: Course-to-teacher assignments per year (ADMIN)
  - name: grades
    description: Grades and grade history (ADMIN, TEACHER for own courses, STUDENT for own grades)
  - name: reports
    description: Annual grade reports by email and graduation lists
paths:
  /auth/login:
    post:
      tags: [auth]
      summary: Login and request a verification link
      description: Checks credentials and sends a login-verification email.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '202':
          description: Accepted — login-verification email sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageBody'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/verification/{token}:
    get:
      tags: [auth]
      summary: Verify the email token and obtain a JWT
      description: |
        Single-use token (15-minute TTL). Consumes the token and returns a JWT
        plus the user payload. Serves login verification.
      operationId: verify
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Verified — JWT issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyRegistrationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /courses:
    post:
      tags: [courses]
      summary: Create a course (ADMIN)
      description: Creates a course. `ref` must be unique across courses.
      operationId: createCourse
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCourseInput'
      responses:
        '201':
          description: Course created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseOutput'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags: [courses]
      summary: List courses (public)
      description: |
        Public endpoint — no authentication required. Lists courses ordered by
        `createdAt`. `search` matches `ref` or `title` (case-insensitive
        substring, partial match). `type` filters by exact learning path.
      operationId: listCourses
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/CourseType'
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Page of courses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseListResponse'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /courses/{courseId}:
    get:
      tags: [courses]
      summary: Get a course by id (ADMIN, TEACHER)
      operationId: getCourse
      security:
        - bearerAuth: []
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The requested course
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseOutput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [courses]
      summary: Partially update a course (ADMIN)
      description: |
        Partially updates the course. `ref`, `title`, `type` and `credits` can
        all be modified; only present fields are applied. A `ref` change must
        stay unique.
      operationId: updateCourse
      security:
        - bearerAuth: []
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCourseInput'
      responses:
        '200':
          description: The updated course
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseOutput'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /exams:
    post:
      tags: [exams]
      summary: Create an exam (ADMIN, TEACHER)
      description: |
        Creates an exam for a course and an academic year. The `coefficient` is
        indicative (e.g. `0.5`, `0.2`, `1/3`); the coefficients of all exams of
        a course must sum to 1. ADMIN can create an exam for any course; a
        TEACHER can only create exams for courses assigned to them.
      operationId: createExam
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExamInput'
      responses:
        '201':
          description: Exam created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exam'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags: [exams]
      summary: List exams (ADMIN, TEACHER)
      description: |
        Lists exams ordered by `date`. `ref` (course ref, partial match),
        `academicYear` (exact match), `startDate` and `endDate` (exam `date`
        range) filters. ADMIN sees all exams; a TEACHER only sees exams of
        courses assigned to them.
      operationId: listExams
      security:
        - bearerAuth: []
      parameters:
        - name: ref
          in: query
          required: false
          schema:
            type: string
            maxLength: 10
          description: Course ref of the exam (partial match)
        - name: academicYear
          in: query
          required: false
          schema:
            type: integer
        - name: startDate
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Inclusive lower bound on exam `date`
        - name: endDate
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Inclusive upper bound on exam `date`
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Page of exams
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /exams/{examId}:
    get:
      tags: [exams]
      summary: Get an exam by id (ADMIN, TEACHER)
      operationId: getExam
      security:
        - bearerAuth: []
      parameters:
        - name: examId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The requested exam
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exam'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [exams]
      summary: Partially update an exam (ADMIN, TEACHER)
      description: |
        Only present fields are applied. ADMIN can update any exam; a TEACHER
        can only update exams of courses assigned to them and cannot change the
        `courseId` (an exam stays attached to the course it was created for).
      operationId: updateExam
      security:
        - bearerAuth: []
      parameters:
        - name: examId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateExamInput'
      responses:
        '200':
          description: The updated exam
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exam'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [exams]
      summary: Delete an exam (ADMIN, TEACHER)
      description: |
        ADMIN can delete any exam; a TEACHER can only delete exams of courses
        assigned to them. Refused (409) when grades still reference it.
      operationId: deleteExam
      security:
        - bearerAuth: []
      parameters:
        - name: examId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted — no content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /teachers:
    post:
      tags: [teachers]
      summary: Create a teacher (ADMIN)
      description: |
        Creates the underlying user account (role `TEACHER`) and its teacher
        inheritance record in one operation. `username`, `email` and `ref` must
        be unique.
      operationId: createTeacher
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTeacherInput'
      responses:
        '201':
          description: Teacher created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserExtendTeacher'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags: [teachers]
      summary: List teachers (ADMIN)
      description: |
        Lists teachers. `search` matches `ref`, first name or last name
        (case-insensitive substring, partial match). `teacherStatus` filters by
        exact status. `page` is 1-indexed; a `page` or `size` below 1 or above
        100 is not an error — it falls back to the default (1 and 10).
      operationId: listTeachers
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: teacherStatus
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TeacherStatus'
        - name: page
          in: query
          required: false
          description: 1-indexed page. Values below 1 or above 100 fall back to 1.
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          required: false
          description: Page size. Values below 1 or above 100 fall back to 10.
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Page of teachers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /teachers/{teacherId}:
    get:
      tags: [teachers]
      summary: Get a teacher by id (ADMIN)
      operationId: getTeacher
      security:
        - bearerAuth: []
      parameters:
        - name: teacherId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The requested teacher
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserExtendTeacher'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [teachers]
      summary: Partially update a teacher (ADMIN)
      description: Only present fields are applied. A `ref` change must stay unique.
      operationId: updateTeacher
      security:
        - bearerAuth: []
      parameters:
        - name: teacherId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTeacherInput'
      responses:
        '200':
          description: The updated teacher
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserExtendTeacher'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /students:
    post:
      tags: [students]
      summary: Bulk insert students (ADMIN)
      description: |
        Creates the underlying user accounts (role `STUDENT`) and their student
        inheritance records in one atomic operation. Students are not created
        through self-registration — an `ADMIN` provisions them. The batch is
        all-or-nothing: if any item is invalid, references an unknown `groupId`
        / `classId`, or collides on `username`, `email` or `ref`, the whole
        request fails and no student is created. Max 100 students per request.
      operationId: createStudents
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStudentRequest'
      responses:
        '201':
          description: Students created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateStudentListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags: [students]
      summary: List students (ADMIN, TEACHER)
      description: |
        Lists students. `search` matches `ref`, first name or last name
        (case-insensitive substring, partial match). `learningPath`,
        `studentStatus` and `className` are exact-match filters.
      operationId: listStudents
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: learningPath
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/LearningPath'
        - name: studentStatus
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/StudentStatus'
        - name: className
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Page of students
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /students/{studentId}:
    get:
      tags: [students]
      summary: Get a student by id
      description: ADMIN, a TEACHER, or the STUDENT who owns the record.
      operationId: getStudent
      security:
        - bearerAuth: []
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The requested student
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserExtendStudent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [students]
      summary: Partially update a student (ADMIN)
      description: |
        Only present fields are applied. Marking a student `GRADUATED` with a
        `graduationYear` sets their graduation year. A `ref` or `className`
        change must stay unique.
      operationId: updateStudent
      security:
        - bearerAuth: []
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStudentInput'
      responses:
        '200':
          description: The updated student
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserExtendStudent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /groups:
    post:
      tags: [groups]
      summary: Create a group (ADMIN)
      description: Creates a student group (e.g. `CQ1`, `TSMA1`). `ref` must be unique.
      operationId: createGroup
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroupInput'
      responses:
        '201':
          description: Group created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupOutput'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags: [groups]
      summary: List groups (ADMIN, TEACHER)
      description: |
        Lists groups. `search` matches `ref` (case-insensitive substring,
        partial match). `type` filters by exact learning path.
      operationId: listGroups
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/CourseType'
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Page of groups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /groups/{groupId}:
    get:
      tags: [groups]
      summary: Get a group by id (ADMIN, TEACHER)
      operationId: getGroup
      security:
        - bearerAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The requested group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupOutput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [groups]
      summary: Partially update a group (ADMIN)
      description: Only present fields are applied. A `ref` change must stay unique.
      operationId: updateGroup
      security:
        - bearerAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGroupInput'
      responses:
        '200':
          description: The updated group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupOutput'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [groups]
      summary: Delete a group (ADMIN)
      description: Deletes the group.
      operationId: deleteGroup
      security:
        - bearerAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted — no content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /teacher-courses:
    post:
      tags: [assignments]
      summary: Assign a course to a teacher (ADMIN)
      description: |
        Assigns a course to a teacher for a period, starting at `assignedAt`.
        A teacher can teach the same course in several academic years — re-assign
        by closing the previous period and creating a new assignment. A given
        (teacher, course) pair is unique.
      operationId: assignTeacherToCourse
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTeacherCourseInput'
      responses:
        '201':
          description: Assignment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherCourse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags: [assignments]
      summary: List teacher-course assignments
      description: |
        Lists assignments ordered by `assignedAt`. Each item embeds the full
        teacher user (with its inheritance record) and the full course. ADMIN sees all
        assignments; a TEACHER only sees the courses assigned to themselves.
        `teacherId` and `courseId` are exact-match filters.
      operationId: listTeacherCourses
      security:
        - bearerAuth: []
      parameters:
        - name: teacherId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: courseId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Page of assignments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherCourseListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /teacher-courses/{teacherCourseId}:
    delete:
      tags: [assignments]
      summary: Remove a teacher-course assignment (ADMIN)
      operationId: deleteTeacherCourse
      security:
        - bearerAuth: []
      parameters:
        - name: teacherCourseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted — no content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /grades:
    post:
      tags: [grades]
      summary: Record a grade (ADMIN, TEACHER)
      description: |
        Records the grade of a student for an exam. ADMIN can grade any exam; a
        TEACHER can only grade exams of courses assigned to them. The grade is
        stored as the initial `history` entry (`grade` is the current value).
        A student can only have one grade per exam.
      operationId: createGrade
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGradeInput'
      responses:
        '201':
          description: Grade recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Grade'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /grades/{studentId}:
    get:
      tags: [grades]
      summary: List a student's grades
      description: |
        Lists the grades of the student identified by `studentId`. `examId` and
        `academicYear` are exact-match filters. ADMIN and TEACHER can list any
        student's grades (a TEACHER only sees grades of exams of courses
        assigned to them); a STUDENT can only list their own grades — the path
        `studentId` is forced to the authenticated student.
      operationId: listGrades
      security:
        - bearerAuth: []
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: examId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: academicYear
          in: query
          required: false
          schema:
            type: integer
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Page of grades
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GradeListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /grades/{gradeId}:
    patch:
      tags: [grades]
      summary: Correct a grade (ADMIN, TEACHER)
      description: |
        Appends a new `history` entry with the corrected value and a mandatory
        `description` (e.g. "transcription error"). The current grade becomes
        this latest entry. A TEACHER can only correct grades of exams of courses
        assigned to them.
      operationId: updateGrade
      security:
        - bearerAuth: []
      parameters:
        - name: gradeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGradeInput'
      responses:
        '200':
          description: The corrected grade
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Grade'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /grades/{gradeId}/history:
    get:
      tags: [grades]
      summary: Get a grade's correction history
      description: |
        Chronological history of the grade (initial entry then corrections).
        ADMIN sees any history; a TEACHER only for exams of courses assigned to
        them; a STUDENT only their own grades' history.
      operationId: getGradeHistory
      security:
        - bearerAuth: []
      parameters:
        - name: gradeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The grade's history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /grade-reports:
    post:
      tags: [reports]
      summary: Generate and email an annual grade report (ADMIN)
      description: |
        Asynchronous. Computes the provisional annual transcript of a student
        for an academic year (annual general average, validated credits) and
        sends the PDF by email (S3 + SES), addressed to the student.
      operationId: generateGradeReport
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GradeReportRequest'
      responses:
        '202':
          description: Accepted — the annual transcript will be emailed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageBody'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /graduations/{promotion}:
    get:
      tags: [reports]
      summary: List the graduates of a promotion, ranked
      description: |
        Graduates of the promotion over the 3 years, sorted by rank. A student
        is a graduate of the promotion if they scored ≥ 10 in every course of
        their learning path across all 3 academic years. Columns: rank, student
        id, last name, first name, general average.
      operationId: getGraduates
      security:
        - bearerAuth: []
      parameters:
        - name: promotion
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Ranked graduates of the promotion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraduatesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /graduations/{promotion}/download:
    get:
      tags: [reports]
      summary: Download the graduates list as XLSX
      description: |
        Same ranked graduates as `GET /graduations/{promotion}`, exported as an
        XLSX workbook (columns: rank, student id, last name, first name, general
        average) stored on S3 and streamed to the client.
      operationId: downloadGraduates
      security:
        - bearerAuth: []
      parameters:
        - name: promotion
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: XLSX workbook of the graduates list
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT from `GET /auth/verification/{token}` (subject = user id, claim `role`)
  responses:
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            status: 400
            error: Bad Request
            message: "Malformed request: invalid UUID in path"
            timestamp: 2026-08-13T12:00:00Z
    Unauthorized:
      description: Missing/invalid JWT or bad credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            status: 401
            error: Unauthorized
            message: Missing or invalid token
            timestamp: 2026-08-13T12:00:00Z
    Forbidden:
      description: Authenticated but not allowed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            status: 403
            error: Forbidden
            message: Access denied for this role
            timestamp: 2026-08-13T12:00:00Z
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            status: 404
            error: Not Found
            message: Resource not found
            timestamp: 2026-08-13T12:00:00Z
    Conflict:
      description: Uniqueness conflict (username, email or ref already in use)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            status: 409
            error: Conflict
            message: A resource with this unique value already exists
            timestamp: 2026-08-13T12:00:00Z
    UnprocessableContent:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            status: 422
            error: Unprocessable Content
            message: "Validation failed: coefficient must be greater than 0"
            timestamp: 2026-08-13T12:00:00Z
    InternalServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            status: 500
            error: Internal Server Error
            message: An unexpected error occurred
            timestamp: 2026-08-13T12:00:00Z
  schemas:
    UserRole:
      type: string
      enum: [ADMIN, TEACHER, STUDENT]
    Level:
      type: string
      enum: [L1, L2, L3]
      description: Academic level a student belongs to.
    LearningPath:
      type: string
      enum: [EL, TN, COMMON]
      description: Student learning path. COMMON applies to both paths.
    CourseType:
      type: string
      enum: [EL, TN, COMMON]
      description: Learning path a course or group belongs to. COMMON = shared by all paths.
    TeacherStatus:
      type: string
      enum: [ACTIVE, INACTIVE, OTHER]
    StudentStatus:
      type: string
      enum: [GRADUATED, ACTIVE, INACTIVE]
    User:
      type: object
      required: [id, username, firstName, lastName, email, role, createdAt]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
          maxLength: 50
        firstName:
          type: string
          maxLength: 100
        lastName:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 100
        role:
          $ref: '#/components/schemas/UserRole'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true
      example:
        id: 3f3e9b2a-1c4e-4a9d-8f2b-5e7a1c0d9f21
        username: mdupont
        firstName: Marie
        lastName: Dupont
        email: marie.dupont@hacheuil.edu
        role: STUDENT
        createdAt: 2023-09-04T09:00:00Z
        updatedAt: null
    LoginInput:
      type: object
      required: [password]
      description: Either `username` or `email` plus `password`
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
      example:
        username: mdupont
        password: s3cur3P@ss
    MessageBody:
      type: object
      required: [message]
      properties:
        message:
          type: string
      example:
        message: A verification link has been sent to your email
    VerifyRegistrationResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          description: JWT (subject = user id, claim `role`)
        user:
          $ref: '#/components/schemas/User'
      example:
        token: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIzZjNlOWIyYSIsInJvbGUiOiJTVFVERU5UIn0.SIGNATURE
        user:
          id: 3f3e9b2a-1c4e-4a9d-8f2b-5e7a1c0d9f21
          username: mdupont
          firstName: Marie
          lastName: Dupont
          email: marie.dupont@hacheuil.edu
          role: STUDENT
          createdAt: 2023-09-04T09:00:00Z
          updatedAt: null
    CourseOutput:
      type: object
      required: [id, ref, title, type, credits, createdAt]
      properties:
        id:
          type: string
          format: uuid
        ref:
          type: string
          maxLength: 10
          description: Course reference (e.g. `EP1`, `PRJ1`)
        title:
          type: string
          maxLength: 100
          pattern: '^[A-Za-z0-9èéê -]+$'
        type:
          $ref: '#/components/schemas/CourseType'
        credits:
          type: integer
          minimum: 1
          maximum: 30
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true
      example:
        id: 8a1f2b3c-4d5e-4f6a-9b0c-1d2e3f4a5b6c
        ref: EP1
        title: Digital Electronics
        type: EL
        credits: 6
        createdAt: 2023-09-01T08:00:00Z
        updatedAt: null
    CreateCourseInput:
      type: object
      required: [ref, title, credits]
      properties:
        ref:
          type: string
          maxLength: 10
          description: Course reference (e.g. `EP1`, `PRJ1`)
        title:
          type: string
          maxLength: 100
          pattern: '^[A-Za-z0-9èéê -]+$'
          description: Course title. May only contain letters, numbers, spaces, and the symbols `- è é ê`.
        type:
          $ref: '#/components/schemas/CourseType'
          default: COMMON
        credits:
          type: integer
          minimum: 1
          maximum: 30
      example:
        ref: EP1
        title: Digital Electronics
        type: EL
        credits: 6
    UpdateCourseInput:
      type: object
      description: Partial update — only present fields are applied
      properties:
        ref:
          type: string
          maxLength: 10
        title:
          type: string
          maxLength: 100
          pattern: '^[A-Za-z0-9èéê -]+$'
          description: Course title. May only contain letters, numbers, spaces, and the symbols `- è é ê`.
        type:
          $ref: '#/components/schemas/CourseType'
        credits:
          type: integer
          minimum: 1
          maximum: 30
      example:
        title: Digital Electronics (updated)
    Exam:
      type: object
      required: [id, courseId, coefficient, academicYear, date, createdAt]
      properties:
        id:
          type: string
          format: uuid
        courseId:
          type: string
          format: uuid
        coefficient:
          type: number
          exclusiveMinimum: 0
          description: Indicative weight of the exam. The coefficients of all exams of a course must sum to 1.
        academicYear:
          type: integer
          description: Academic year the exam belongs to (e.g. `2023`)
        date:
          type: string
          format: date-time
          description: Exam date/time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true
      example:
        id: 4b2c3d4e-5f6a-4b7c-8d9e-0f1a2b3c4d5e
        courseId: 8a1f2b3c-4d5e-4f6a-9b0c-1d2e3f4a5b6c
        coefficient: 0.5
        academicYear: 2023
        date: 2024-01-15T09:00:00Z
        createdAt: 2023-12-01T10:00:00Z
        updatedAt: null
    CreateExamInput:
      type: object
      required: [courseId, coefficient, academicYear, date]
      properties:
        courseId:
          type: string
          format: uuid
        coefficient:
          type: number
          exclusiveMinimum: 0
          description: Indicative weight of the exam. The coefficients of all exams of a course must sum to 1.
        academicYear:
          type: integer
          description: Academic year the exam belongs to (e.g. `2023`)
        date:
          type: string
          format: date-time
          description: Exam date/time
      example:
        courseId: 8a1f2b3c-4d5e-4f6a-9b0c-1d2e3f4a5b6c
        coefficient: 0.5
        academicYear: 2023
        date: 2024-01-15T09:00:00Z
    UpdateExamInput:
      type: object
      description: Partial update — only present fields are applied
      properties:
        courseId:
          type: string
          format: uuid
        coefficient:
          type: number
          exclusiveMinimum: 0
        academicYear:
          type: integer
        date:
          type: string
          format: date-time
      example:
        coefficient: 0.2
    TeacherInheritance:
      type: object
      required: [id, ref, teacherStatus]
      properties:
        id:
          type: string
          format: uuid
          description: Teacher inheritance id
        ref:
          type: string
          maxLength: 10
        joinedAt:
          type: string
          format: date-time
          nullable: true
        teacherStatus:
          $ref: '#/components/schemas/TeacherStatus'
      example:
        id: 5c3d4e5f-6a7b-4c8d-9e0f-1a2b3c4d5e6f
        ref: T001
        joinedAt: 2023-09-01T08:00:00Z
        teacherStatus: ACTIVE
    UserExtendTeacher:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          required: [teacherInheritance]
          properties:
            teacherInheritance:
              $ref: '#/components/schemas/TeacherInheritance'
      description: User account with its embedded teacher inheritance record.
      example:
        id: 2f4e9b2a-1c4e-4a9d-8f2b-5e7a1c0d9f21
        username: p.martin
        firstName: Paul
        lastName: Martin
        email: paul.martin@hacheuil.edu
        role: TEACHER
        createdAt: 2023-09-01T08:00:00Z
        updatedAt: null
        teacherInheritance:
          id: 5c3d4e5f-6a7b-4c8d-9e0f-1a2b3c4d5e6f
          ref: T001
          joinedAt: 2023-09-01T08:00:00Z
          teacherStatus: ACTIVE
    CreateTeacherInput:
      type: object
      required: [username, password, firstName, lastName, email, ref]
      description: Creates the user account (role TEACHER) and its teacher inheritance record.
      properties:
        username:
          type: string
          maxLength: 50
        password:
          type: string
          format: password
          minLength: 12
          description: 12+ chars with upper, lower, digit and special char
        firstName:
          type: string
          maxLength: 100
        lastName:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 100
        ref:
          type: string
          maxLength: 10
        joinedAt:
          type: string
          format: date-time
          nullable: true
        teacherStatus:
          $ref: '#/components/schemas/TeacherStatus'
      example:
