      description: |
        Lists the grades of the student inheritance record identified by
        `studentInheritanceId`. `courseRef` and `academicYear` are filters
        (`courseRef` is a partial match, `academicYear` is exact). ADMIN and
        TEACHER can list any student's grades (a TEACHER only sees grades of
        exams of courses assigned to them); a STUDENT can only list their own
        grades — the path `studentInheritanceId` is forced to the
        authenticated student.
      operationId: listGrades
      security:
        - bearerAuth: []
      parameters:
        - name: studentInheritanceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: courseRef
          in: query
          required: false
          description: Course ref of the exams to filter on (partial match)
          schema:
            type: string
            maxLength: 10
        - name: academicYear
          in: query
          required: false
          description: Exact match on the exam's academic year (e.g. `2024-2025`)
          schema:
            type: string
            maxLength: 10
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: size
          in: query
