            Σ (courseWeightedAverage × course.credits) / Σ course.credits.
            Each courseWeightedAverage is Σ (grade.value × exam.coefficient)
            over all graded exams of that course (coefficients sum to 1).
      example:
        studentInheritanceId: 6d4e5f6a-7b8c-4d9e-0f1a-2b3c4d5e6f7a
        academicYear: '2024-2025'
        generalAverage: 14.25
    Meta:
      type: object
      required: [page, size, total]
      properties:
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          format: int64
      example:
